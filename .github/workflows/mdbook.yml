# Workflow for building and deploying mdBook site and field-projections to GitHub Pages
name: Deploy Pages

# Runs on pushes and PRs targeting the default branch
on:
  push:
    branches: ["main", "trial/field-projections"]

  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Allows running from promote workflow
  workflow_call:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: mdbook@0.5.2
      - name: Install mdbook-linkcheck
        uses: baptiste0928/cargo-install@v3
        # Temporarily pull the fix for https://github.com/Michael-F-Bryan/mdbook-linkcheck/pull/98
        with:
          crate: mdbook-linkcheck
          git: https://github.com/schilkp/mdbook-linkcheck
          rev: ed981be6ded11562e604fff290ae4c08f1c419c5
      - name: Install mdbook-backlinks
        uses: baptiste0928/cargo-install@v3
        with:
          crate: mdbook-backlinks
          git: https://github.com/Nadrieril/mdbook-backlinks
          rev: b2ce2e69219a2065dd9c054154e2a9d5e53a1d95
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with mdBook
        run: mdbook build
      - name: Setup Just
        uses: extractions/setup-just@v4
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-13
          components: rustfmt
      - name: Build field-projections documentation
        run: |
          cd field-projections
          just pages
      - name: Integrate field-projections pages into book
        run: |
          mkdir -p book/html/field-projections
          cp -r field-projections/target/pages/* book/html/field-projections/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/html

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
