[workspace]
resolver = "3"
members = [
  "design",
  "helpers/macros",
  "examples/unnormalized",
  "examples/RfL",
  "examples/struct_of_arrays",
  "examples/simple",
  "examples/file_slice",
]

[workspace.dependencies]
design = { path = "design" }
macros = { path = "helpers/macros" }

proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = [
  "full",
  "extra-traits",
  "visit",
  "visit-mut",
] }
